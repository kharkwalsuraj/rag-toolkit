[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-toolkit"
version = "0.1.0"
description = "RAG over PDFs: MinerU parsing, structure-aware chunking, local embeddings and reranking, Qdrant, Gemini."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "qdrant-client>=1.10",
    "sentence-transformers>=3.0",
    "google-genai>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "python-dotenv>=1.0"]

[tool.hatch.build.targets.wheel]
packages = ["rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v -s"  # -s shows the output printed by the example test
